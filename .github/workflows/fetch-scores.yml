name: Fetch WC2026 Scores

on:
  schedule:
    - cron: '*/2 * * * *'   # every 2 minutes all day
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch ALL matches (full competition)
        run: |
          HTTP=$(curl -s -w "%{http_code}" \
            -H "X-Auth-Token: 72f45df7ce7b4991ac9ebd929bf4c53d" \
            "https://api.football-data.org/v4/competitions/2000/matches?season=2026" \
            -o data/matches_raw.json)
          echo "HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            cp data/matches_raw.json data/matches.json
            echo "matches.json updated"
          else
            echo "ERROR: API returned $HTTP"
            cat data/matches_raw.json
          fi

      - name: Fetch TODAY matches separately (fresher KO data)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TOMORROW=$(date -u -d '+1 day' +%Y-%m-%d 2>/dev/null || date -u -v+1d +%Y-%m-%d)
          echo "Fetching $TODAY and $TOMORROW"
          HTTP=$(curl -s -w "%{http_code}" \
            -H "X-Auth-Token: 72f45df7ce7b4991ac9ebd929bf4c53d" \
            "https://api.football-data.org/v4/competitions/2000/matches?dateFrom=${TODAY}&dateTo=${TOMORROW}" \
            -o data/today.json)
          echo "today.json HTTP: $HTTP"
          cat data/today.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for m in d.get('matches',[]):
              home=(m.get('homeTeam') or {}).get('name','TBD')
              away=(m.get('awayTeam') or {}).get('name','TBD')
              print(f'  {m[\"utcDate\"]} {m[\"status\"]} [{home}] vs [{away}] score={m[\"score\"][\"fullTime\"]}')
          " || echo "Parse error"

      - name: Fetch top scorers
        run: |
          curl -s \
            -H "X-Auth-Token: 72f45df7ce7b4991ac9ebd929bf4c53d" \
            "https://api.football-data.org/v4/competitions/2000/scorers?season=2026&limit=400" \
            -o data/scorers.json

      - name: Fetch goal events for recently-finished matches
        run: |
          mkdir -p data/match-details
          python3 scripts/fetch-match-details.py

      - name: Show summary
        run: |
          python3 -c "
          import json
          d = json.load(open('data/matches.json'))
          matches = d.get('matches', [])
          finished = [m for m in matches if m['score']['fullTime']['home'] is not None]
          live = [m for m in matches if m.get('status') in ('IN_PLAY','PAUSED')]
          ko_done = [m for m in finished if m.get('stage') not in ('GROUP_STAGE',)]
          print(f'Total: {len(matches)} | Finished: {len(finished)} | Live: {len(live)} | KO finished: {len(ko_done)}')
          for m in ko_done[:5]:
              home=(m.get('homeTeam') or {}).get('name','?')
              away=(m.get('awayTeam') or {}).get('name','?')
              print(f'  KO: {home} {m[\"score\"][\"fullTime\"][\"home\"]}-{m[\"score\"][\"fullTime\"][\"away\"]} {away}')
          "

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/scorers.json data/today.json data/match-details.json data/match-details/
          git diff --staged --quiet || git commit -m "scores $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push